version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 4
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      storybook:
        patterns:
          - 'storybook'
          - '@storybook/*'
          - 'eslint-plugin-storybook'
        update-types:
          - minor
          - patch
      testing:
        patterns:
          - '@testing-library/*'
          - 'vitest'
          - 'jsdom'
          - '@playwright/test'
        update-types:
          - minor
          - patch
      lint:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'globals'
          - 'prettier'
          - 'typescript-eslint'
        update-types:
          - minor
          - patch
      vite:
        patterns:
          - 'vite'
          - '@vitejs/*'
          - 'vite-plugin-dts'
        update-types:
          - minor
          - patch
      types:
        patterns:
          - '@types/*'
        update-types:
          - minor
          - patch
      other:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
