name: PR assignment

# Reviewers are fruitizz and kplaricos, except when either is the PR author.

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, assigned, unassigned, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-assignment-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  assign:
    name: Assign author and request reviewers
    # Dependabot PRs get a read-only GITHUB_TOKEN; assigning the bot 403s.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const REVIEWERS = ['fruitizz', 'kplaricos'];
            const { owner, repo } = context.repo;
            const pull_number = context.issue.number;
            const pr = context.payload.pull_request;
            const author = pr.user.login;

            const desired = REVIEWERS.filter(
              (reviewer) => reviewer.toLowerCase() !== author.toLowerCase(),
            );

            await github.rest.issues.addAssignees({
              owner,
              repo,
              issue_number: pull_number,
              assignees: [author],
            });

            const requested = (pr.requested_reviewers ?? []).map(
              (reviewer) => reviewer.login,
            );
            const toAdd = desired.filter(
              (member) =>
                !requested.some(
                  (login) => login.toLowerCase() === member.toLowerCase(),
                ),
            );
            const toRemove = requested.filter(
              (login) =>
                !desired.some(
                  (reviewer) => reviewer.toLowerCase() === login.toLowerCase(),
                ),
            );

            if (toRemove.length > 0) {
              await github.rest.pulls.removeRequestedReviewers({
                owner,
                repo,
                pull_number,
                reviewers: toRemove,
              });
            }

            if (toAdd.length === 0) {
              return;
            }

            try {
              await github.rest.pulls.requestReviewers({
                owner,
                repo,
                pull_number,
                reviewers: toAdd,
              });
            } catch (error) {
              if (error.status !== 422) {
                throw error;
              }
            }
