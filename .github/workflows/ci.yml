name: CI

# Sur `main`, la CI est lancée par release.yml (job `quality`) : pas de
# déclencheur `push` ici, pour ne pas l'exécuter deux fois.
on:
  workflow_call:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # GHSA-vfj7-8cjw-p6xm n'a aucune version corrigée publiée. `braces` est
      # transitif de Changesets, utilisé seulement sur les motifs contrôlés du
      # dépôt pendant la release. Garder l'exclusion ciblée jusqu'au correctif.
      - run: bun audit --audit-level=high --ignore GHSA-vfj7-8cjw-p6xm
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: Types entry matches package.json
        run: test -f packages/ui/dist/index.d.ts
      - name: Dry-run pack
        run: npm pack --dry-run --workspace @dudaloglobal/d-ui
      - run: bun run build-storybook
